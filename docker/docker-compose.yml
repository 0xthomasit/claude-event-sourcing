# =============================================================================
# Full local stack — infrastructure + all Spring Boot services
#
# Usage:
#   Start infra first:   docker compose -f docker-compose.infra.yml up -d
#   Start all services:  docker compose up -d
#   Start one service:   docker compose up -d order-service
# =============================================================================
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - shopping-net
  environment: &default-env
    EUREKA_HOST: service-discovery
    POSTGRES_PASSWORD: secret
    MYSQL_PASSWORD: secret

services:

  # ── Infrastructure (Tier 0) ──────────────────────────────────────────────────
  service-discovery:
    <<: *service-defaults
    build:
      context: ../infrastructure/service-discovery
      dockerfile: Dockerfile
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  config-server:
    <<: *service-defaults
    build:
      context: ../infrastructure/config-server
      dockerfile: Dockerfile
    ports: ["8888:8888"]
    depends_on:
      service-discovery:
        condition: service_healthy

  api-gateway:
    <<: *service-defaults
    build:
      context: ../infrastructure/api-gateway
      dockerfile: Dockerfile
    ports: ["8080:8080"]
    environment:
      <<: *default-env
      REDIS_HOST: redis
      JWT_SECRET: change-me-in-prod-this-is-a-long-demo-secret-key-256bits-minimum-len
    depends_on:
      service-discovery:
        condition: service_healthy

  # ── Tier 1: Event Sourcing Services ─────────────────────────────────────────
  order-service:
    <<: *service-defaults
    build:
      context: ../services/order-service
      dockerfile: Dockerfile
    ports: ["8081:8081"]
    environment:
      <<: *default-env
      POSTGRES_ORDER_HOST: postgres-order
      POSTGRES_ORDER_PORT: 5432
      MONGODB_HOST: mongodb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      service-discovery:
        condition: service_healthy

  payment-service:
    <<: *service-defaults
    build:
      context: ../services/payment-service
      dockerfile: Dockerfile
    ports: ["8082:8082"]
    environment:
      <<: *default-env
      POSTGRES_PAYMENT_HOST: postgres-payment
      POSTGRES_PAYMENT_PORT: 5432
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      service-discovery:
        condition: service_healthy

  inventory-service:
    <<: *service-defaults
    build:
      context: ../services/inventory-service
      dockerfile: Dockerfile
    ports: ["8083:8083"]
    environment:
      <<: *default-env
      POSTGRES_INVENTORY_HOST: postgres-inventory
      POSTGRES_INVENTORY_PORT: 5432
      MONGODB_HOST: mongodb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      service-discovery:
        condition: service_healthy

  # ── Tier 2: CRUD + Kafka Consumer ───────────────────────────────────────────
  notification-service:
    <<: *service-defaults
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    ports: ["8084:8084"]
    environment:
      <<: *default-env
      MYSQL_NOTIFICATION_HOST: mysql
      MYSQL_NOTIFICATION_PORT: 3306
      MYSQL_USER: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      service-discovery:
        condition: service_healthy

  shipping-service:
    <<: *service-defaults
    build:
      context: ../services/shipping-service
      dockerfile: Dockerfile
    ports: ["8085:8085"]
    environment:
      <<: *default-env
      MYSQL_SHIPPING_HOST: mysql
      MYSQL_SHIPPING_PORT: 3306
      MYSQL_USER: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      service-discovery:
        condition: service_healthy

  # ── Tier 3: Pure CRUD ────────────────────────────────────────────────────────
  product-service:
    <<: *service-defaults
    build:
      context: ../services/product-service
      dockerfile: Dockerfile
    ports: ["8086:8086"]
    environment:
      <<: *default-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/product_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      service-discovery:
        condition: service_healthy

  user-service:
    <<: *service-defaults
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    ports: ["8087:8087"]
    environment:
      <<: *default-env
      POSTGRES_USER_HOST: postgres-user
      POSTGRES_USER_PORT: 5432
      REDIS_HOST: redis
    depends_on:
      service-discovery:
        condition: service_healthy

  cart-service:
    <<: *service-defaults
    build:
      context: ../services/cart-service
      dockerfile: Dockerfile
    ports: ["8088:8088"]
    environment:
      <<: *default-env
      REDIS_HOST: redis
    depends_on:
      service-discovery:
        condition: service_healthy

  auth-service:
    <<: *service-defaults
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    ports: ["8089:8089"]
    environment:
      <<: *default-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      REDIS_HOST: redis
    depends_on:
      service-discovery:
        condition: service_healthy

  # ── Tier 4: New Services ──────────────────────────────────────────────────
  promotion-service:
    <<: *service-defaults
    build:
      context: ../services/promotion-service
      dockerfile: Dockerfile
    ports: ["8090:8090"]
    environment:
      <<: *default-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-promotion:5432/promotion_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      service-discovery:
        condition: service_healthy

  invoice-service:
    <<: *service-defaults
    build:
      context: ../services/invoice-service
      dockerfile: Dockerfile
    ports: ["8091:8091"]
    environment:
      <<: *default-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-invoice:5432/invoice_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      service-discovery:
        condition: service_healthy

  review-service:
    <<: *service-defaults
    build:
      context: ../services/review-service
      dockerfile: Dockerfile
    ports: ["8092:8092"]
    environment:
      <<: *default-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-review:5432/review_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      service-discovery:
        condition: service_healthy

networks:
  shopping-net:
    driver: bridge
