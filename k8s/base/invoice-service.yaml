apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-service
  namespace: shopping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-service
  template:
    metadata:
      labels:
        app: invoice-service
    spec:
      containers:
        - name: invoice-service
          image: shopping/invoice-service:latest
          ports:
            - containerPort: 8091
          env:
            - name: EUREKA_HOST
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: EUREKA_HOST
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: POSTGRES_INVOICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: POSTGRES_INVOICE_HOST
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopping-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8091
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8091
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-service
  namespace: shopping
spec:
  selector:
    app: invoice-service
  ports:
    - port: 8091
      targetPort: 8091