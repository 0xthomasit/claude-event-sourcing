apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  namespace: shopping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-discovery
  template:
    metadata:
      labels:
        app: service-discovery
    spec:
      containers:
        - name: service-discovery
          image: shopping/service-discovery:latest
          ports:
            - containerPort: 8761
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: service-discovery
  namespace: shopping
spec:
  selector:
    app: service-discovery
  ports:
    - port: 8761
      targetPort: 8761
