apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shopping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: shopping/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_HOST
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: EUREKA_HOST
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: REDIS_HOST
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopping-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shopping
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
