apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: shopping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: shopping/cart-service:latest
          ports:
            - containerPort: 8088
          env:
            - name: EUREKA_HOST
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: EUREKA_HOST
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: REDIS_HOST
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: shopping
spec:
  selector:
    app: cart-service
  ports:
    - port: 8088
      targetPort: 8088